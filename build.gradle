plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'maven-publish'
}

version = '1.1.0'
group = 'com.radiomod'
base.archivesName = 'radiomod'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

// NeoForge run configurations
runs {
    configureEach {
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.logging.console.level', 'debug'
    }
    server {
        systemProperty 'neoforge.logging.console.level', 'debug'
        programArgument '--nogui'
    }
}

repositories {
    mavenCentral()
    maven { name = "ModMaven"; url = "https://modmaven.dev" }
}

dependencies {
    // NeoForge 1.21.1  (latest 21.1.x build, see https://maven.neoforged.net/releases/net/neoforged/neoforge/)
    implementation "net.neoforged:neoforge:21.1.251"

    // ── Audio libraries ─────────────────────────────────────────────
    // MP3 via JLayer/mp3spi, AAC/AAC+ via JAAD (pure-Java, no natives).
    // compileOnly: provides decoder classes at compile time
    // jarJar:      bundles the jars inside META-INF/jarjar/ in the mod jar.
    compileOnly('com.googlecode.soundlibs:mp3spi:1.9.5.4') { transitive = true }
    compileOnly('de.sfuhrm:jaad:0.8.7') { transitive = false }

    jarJar('com.googlecode.soundlibs:mp3spi') {
        version {
            strictly '[1.9.5.4,2.0)'
            prefer '1.9.5.4'
        }
    }
    jarJar('com.googlecode.soundlibs:jlayer') {
        version {
            strictly '[1.0.1,2.0)'
            prefer '1.0.1.4'
        }
    }
    jarJar('com.googlecode.soundlibs:tritonus-share') {
        version {
            strictly '[0.3.7,1.0)'
            prefer '0.3.7.4'
        }
    }
    // JAAD — AAC-LC / HE-AAC (AAC+) decoder, pure Java, no natives.
    // (de.sfuhrm repackaging of JAADec on Maven Central; packages net.sourceforge.jaad.*)
    jarJar('de.sfuhrm:jaad') {
        version {
            strictly '[0.8.7,1.0)'
            prefer '0.8.7'
        }
    }

    // JEI (optional integration — compile-only, latest 1.21.1 NeoForge release)
    compileOnly('mezz.jei:jei-1.21.1-neoforge-api:19.51.0.418')
}

// jarJar output = the deployable mod jar (no classifier = "radiomod-1.1.0.jar")
tasks.named('jarJar') {
    archiveClassifier = ''
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Slim jar (without embedded libs) – not for distribution
    archiveClassifier = 'slim'
    // No manual 'embed' unpacking needed — JarInJar handles it via META-INF/jarjar/
    manifest {
        attributes([
                "Specification-Title"     : "radiomod",
                "Specification-Vendor"    : "radiomod",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "radiomod",
                "Implementation-Timestamp": new java.util.Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

